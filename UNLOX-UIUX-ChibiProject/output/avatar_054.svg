<svg
  id="avatar_054"
  viewBox="0 0 120 200"
  xmlns="http://www.w3.org/2000/svg"
  style="
    --skin:#8D5524;
    --hair:#888888;
    --shirt:#FFB347;
    --hijab:#4A90D9;
    --turban:#E8B84B;
  "
  role="img"
  aria-label="Chibi avatar: elder, deep, skin, nonbinary, with glasses">

  <title>elder, deep, skin, nonbinary, with glasses</title>

  <!-- LAYER ORDER: body → head → hair → face → accessories -->
  <!-- (later layers render on top)                          -->

  <!-- 1. BODY -->
  <g id="layer-body">
    
    <ellipse cx="60" cy="155" rx="33" ry="42"
             fill="var(--shirt)"
             stroke="#333333" stroke-width="2"/>
  </g>

  <!-- 2. HEAD -->
  <g id="layer-head">
    <ellipse
      cx="60" cy="85"
      rx="40" ry="46"
      fill="var(--skin)"
      stroke="#333333" stroke-width="2"/>
  </g>

  <!-- 3. HAIR / HEAD COVERING -->
  <g id="layer-hair">
    
    <ellipse cx="60" cy="55" rx="50" ry="28" fill="var(--hair)"/>
    <circle cx="22" cy="70" r="12" fill="var(--hair)"/>
    <circle cx="98" cy="70" r="12" fill="var(--hair)"/>
    <circle cx="35" cy="58" r="10" fill="var(--hair)"/>
    <circle cx="85" cy="58" r="10" fill="var(--hair)"/>
  </g>

  <!-- 4. FACE FEATURES -->
  <g id="layer-face">
    
    <g id="eyes">
      
    <ellipse cx="44" cy="84"
             rx="11" ry="12"
             fill="white"
             stroke="#333333" stroke-width="1.2"/>
    <ellipse cx="44" cy="86"
             rx="5" ry="5.5"
             fill="#3D2B1F"/>
    <ellipse cx="47" cy="82"
             rx="2.5" ry="2.5"
             fill="white" opacity="0.9"/>
      
    <ellipse cx="76" cy="84"
             rx="11" ry="12"
             fill="white"
             stroke="#333333" stroke-width="1.2"/>
    <ellipse cx="76" cy="86"
             rx="5" ry="5.5"
             fill="#3D2B1F"/>
    <ellipse cx="79" cy="82"
             rx="2.5" ry="2.5"
             fill="white" opacity="0.9"/>
    </g>
    
    <g id="blush">
      <ellipse cx="32" cy="97"
               rx="9" ry="5.5"
               fill="#FF9999" opacity="0.55"/>
      <ellipse cx="88" cy="97"
               rx="9" ry="5.5"
               fill="#FF9999" opacity="0.55"/>
    </g>
    
    <path id="mouth"
          d="M52,106
             Q60,114
             68,106"
          fill="none"
          stroke="#333333"
          stroke-width="1.8"
          stroke-linecap="round"/>
    <!-- Uncomment next line to add a nose: -->
    <!--              -->
  </g>

  <!-- 5. RELIGIOUS ACCESSORIES (bindi, kippah) -->
  <g id="layer-religion">
    
  </g>

  <!-- 6. DISABILITY ACCESSORIES -->
  <g id="layer-disability">
    
    <circle cx="44" cy="84" r="14"
            fill="rgba(200,220,255,0.1)"
            stroke="#555555" stroke-width="1.5"/>
    <circle cx="76" cy="84" r="14"
            fill="rgba(200,220,255,0.1)"
            stroke="#555555" stroke-width="1.5"/>
    <line x1="58" y1="84"
          x2="62" y2="84"
          stroke="#555555" stroke-width="1.5"/>
    <line x1="30" y1="84" x2="10" y2="82"
          stroke="#555555" stroke-width="1.2"/>
    <line x1="90" y1="84" x2="110" y2="82"
          stroke="#555555" stroke-width="1.2"/>
  </g>

</svg>