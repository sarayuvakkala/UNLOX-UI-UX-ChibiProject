<svg
  id="avatar_055"
  viewBox="0 0 120 200"
  xmlns="http://www.w3.org/2000/svg"
  style="
    --skin:#FFDBBD;
    --hair:#8B2500;
    --shirt:#6B8CDA;
    --hijab:#4A90D9;
    --turban:#E8B84B;
  "
  role="img"
  aria-label="Chibi avatar: adult, light, skin, male, with wheelchair, wearing turban">

  <title>adult, light, skin, male, with wheelchair, wearing turban</title>

  <!-- LAYER ORDER: body → head → hair → face → accessories -->
  <!-- (later layers render on top)                          -->

  <!-- 1. BODY -->
  <g id="layer-body">
    
    <ellipse cx="60" cy="155" rx="42" ry="42"
             fill="var(--shirt)"
             stroke="#333333" stroke-width="2"/>
  </g>

  <!-- 2. HEAD -->
  <g id="layer-head">
    <ellipse
      cx="60" cy="85"
      rx="40" ry="46"
      fill="var(--skin)"
      stroke="#333333" stroke-width="2"/>
  </g>

  <!-- 3. HAIR / HEAD COVERING -->
  <g id="layer-hair">
    
    <ellipse cx="60" cy="54" rx="50" ry="32" fill="var(--turban)"/>
    <rect x="10" y="68" width="100" height="18" rx="9" fill="var(--turban)"/>
    <ellipse cx="60" cy="54" rx="18" ry="6" fill="var(--turban)" opacity="0.6"/>
  </g>

  <!-- 4. FACE FEATURES -->
  <g id="layer-face">
    
    <g id="eyes">
      
    <ellipse cx="44" cy="84"
             rx="11" ry="12"
             fill="white"
             stroke="#333333" stroke-width="1.2"/>
    <ellipse cx="44" cy="86"
             rx="5" ry="5.5"
             fill="#3D2B1F"/>
    <ellipse cx="47" cy="82"
             rx="2.5" ry="2.5"
             fill="white" opacity="0.9"/>
      
    <ellipse cx="76" cy="84"
             rx="11" ry="12"
             fill="white"
             stroke="#333333" stroke-width="1.2"/>
    <ellipse cx="76" cy="86"
             rx="5" ry="5.5"
             fill="#3D2B1F"/>
    <ellipse cx="79" cy="82"
             rx="2.5" ry="2.5"
             fill="white" opacity="0.9"/>
    </g>
    
    <g id="blush">
      <ellipse cx="32" cy="97"
               rx="9" ry="5.5"
               fill="#FF9999" opacity="0.55"/>
      <ellipse cx="88" cy="97"
               rx="9" ry="5.5"
               fill="#FF9999" opacity="0.55"/>
    </g>
    
    <path id="mouth"
          d="M52,106
             Q60,114
             68,106"
          fill="none"
          stroke="#333333"
          stroke-width="1.8"
          stroke-linecap="round"/>
    <!-- Uncomment next line to add a nose: -->
    <!--              -->
  </g>

  <!-- 5. RELIGIOUS ACCESSORIES (bindi, kippah) -->
  <g id="layer-religion">
    
  </g>

  <!-- 6. DISABILITY ACCESSORIES -->
  <g id="layer-disability">
    
    <circle cx="42" cy="185" r="11" fill="none"
            stroke="#666666" stroke-width="2"/>
    <circle cx="42" cy="185" r="3" fill="#666666"/>
    <circle cx="78" cy="185" r="11" fill="none"
            stroke="#666666" stroke-width="2"/>
    <circle cx="78" cy="185" r="3" fill="#666666"/>
    <path d="M42,174 L60,172 L72,185" fill="none"
          stroke="#666666" stroke-width="2" stroke-linecap="round"/>
    <path d="M60,172 L60,158 L74,150" fill="none"
          stroke="#666666" stroke-width="2" stroke-linecap="round"/>
    <path d="M36,174 L56,174" fill="none"
          stroke="#666666" stroke-width="2" stroke-linecap="round"/>
  </g>

</svg>